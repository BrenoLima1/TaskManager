<div class="dashboard-container">

  <header class="dashboard-header">
    <div>
      <h1>Dashboard</h1>
      <p>Bem-vindo ao seu gerenciador de tarefas.</p>
    </div>
  </header>

  <section class="dashboard-content">
    <h2>Visão geral</h2>

    <div class="stats-grid">

      <div class="stat-card total">
        <span class="stat-label">Total de tarefas</span>
        <h3>12</h3>
        <span class="stat-description">Tarefas cadastradas</span>
      </div>

      <div class="stat-card completed">
        <span class="stat-label">Concluídas</span>
        <h3>7</h3>
        <span class="stat-description">Tarefas finalizadas</span>
      </div>

      <div class="stat-card pending">
        <span class="stat-label">Pendentes</span>
        <h3>5</h3>
        <span class="stat-description">Tarefas em andamento</span>
      </div>

      <div class="stat-card high-priority">
        <span class="stat-label">Prioridade alta</span>
        <h3>3</h3>
        <span class="stat-description">Precisam de atenção</span>
      </div>

    </div>

  </section>

</div>
